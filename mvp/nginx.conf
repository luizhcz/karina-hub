server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json text/javascript;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # Cache agressivo para assets estáticos
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy pra API backend — BACKEND_URL é injetado via envsubst no startup
    location /api/aihub/ {
        proxy_pass ${BACKEND_URL}/api/aihub/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Rotas com parâmetro dinâmico (:id no path) — preserva URLs existentes
    # como /agentes/abc/versoes ao invés de query strings. JS da página lê
    # o id de `window.location.pathname.split('/')[2]`.
    #
    # nginx avalia `location ~` na ordem do arquivo — patterns mais específicos
    # (versoes/sandbox/implantar) vêm ANTES dos genéricos pra casar primeiro.

    location ~ ^/agentes/[^/]+/versoes$ {
        try_files /agentes/versoes.html =404;
    }

    location ~ ^/agentes/[^/]+/sandbox$ {
        try_files /agentes/sandbox.html =404;
    }

    location ~ ^/agentes/[^/]+/implantar$ {
        try_files /agentes/implantar.html =404;
    }

    location ~ ^/agentes/(novo|[^/]+)$ {
        try_files /agentes/editor.html =404;
    }

    location ~ ^/mcps/(nova|[^/]+)$ {
        try_files /mcps/editor.html =404;
    }

    location ~ ^/ferramentas/(nova|[^/]+)$ {
        try_files /ferramentas/editor.html =404;
    }

    # Cascade pra arquivos estáticos com URL limpa (sem .html):
    #   1. $uri — arquivo físico exato (ex: /lib/api.js)
    #   2. $uri.html — rotas vanilla com URL limpa (ex: /dashboard → /dashboard.html)
    #   3. $uri/index.html — subdirs (ex: /agentes → /agentes/index.html)
    #   4. /index.html — Onboarding como SPA-like fallback. Rotas inexistentes
    #      caem aqui; o JS do Onboarding redireciona pra /dashboard se identity
    #      já existe.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
