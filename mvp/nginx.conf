server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json text/javascript;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # Cache agressivo para assets com hash do Vite
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy pra API backend — BACKEND_URL é injetado via envsubst no startup
    location /api/aihub/ {
        proxy_pass ${BACKEND_URL}/api/aihub/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Cascade de fallback durante a migração React → vanilla (rota por rota):
    #   1. $uri — arquivo físico exato (ex: /test.html, /lib/api.js)
    #   2. $uri.html — rotas vanilla com URL limpa (ex: /dashboard → /dashboard.html)
    #   3. $uri/index.html — subdirs (ex: /agentes → /agentes/index.html)
    #   4. /index.html — fallback final pro React SPA (rota ainda não migrada)
    #
    # Conforme cada rota migra, basta criar o .html correspondente em public/
    # — nginx serve estático automaticamente. /index.html é o entry do React e
    # absorve URLs ainda não migradas.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
