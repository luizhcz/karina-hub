server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json text/javascript;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # Cache agressivo para assets com hash do Vite
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy pra API backend — BACKEND_URL é injetado via envsubst no startup
    location /api/aihub/ {
        proxy_pass ${BACKEND_URL}/api/aihub/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Rotas com parâmetro dinâmico (:id no path) — preserva URLs existentes
    # como /agentes/abc/versoes ao invés de query strings. JS da página lê
    # o id de `window.location.pathname.split('/')[2]`.
    #
    # Adicionar uma regex por rota dinâmica conforme migrar. As regex são
    # mais específicas que o `location /` cascade abaixo, então casam primeiro.

    # GET /agentes/{id}/versoes
    location ~ ^/agentes/[^/]+/versoes$ {
        try_files /agentes/versoes.html =404;
    }

    # GET /mcps/nova ou /mcps/{id} — editor (mode detectado pelo JS via pathname)
    location ~ ^/mcps/(nova|[^/]+)$ {
        try_files /mcps/editor.html =404;
    }

    # GET /ferramentas/nova ou /ferramentas/{id} — editor
    location ~ ^/ferramentas/(nova|[^/]+)$ {
        try_files /ferramentas/editor.html =404;
    }

    # Cascade de fallback durante a migração React → vanilla (rota por rota):
    #   1. $uri — arquivo físico exato (ex: /test.html, /lib/api.js)
    #   2. $uri.html — rotas vanilla com URL limpa (ex: /dashboard → /dashboard.html)
    #   3. $uri/index.html — subdirs (ex: /agentes → /agentes/index.html)
    #   4. /react-fallback.html — fallback final pro React SPA (rota ainda
    #      não migrada). Renomeado de /index.html durante a migração pra
    #      liberar /index.html como Onboarding vanilla.
    #
    # Conforme cada rota migra, basta criar o .html correspondente em public/
    # — nginx serve estático automaticamente. Após Fase 5 (cleanup React),
    # /react-fallback.html some e o cascade termina em /index.html.
    location / {
        try_files $uri $uri.html $uri/index.html /react-fallback.html;
    }
}
