server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json text/javascript;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # Cache agressivo para assets com hash do Vite
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Analytics consome SÓ endpoints REST agregados (sem SSE). Buffering padrão
    # do nginx é OK aqui — quando alguma tela passar a usar /executions/{id}/stream
    # ou /evaluations/runs/{id}/stream, adicionar location-block dedicado igual
    # ao mvp/nginx.conf (proxy_buffering off + gzip off + X-Accel-Buffering no).

    # Proxy pra API backend — BACKEND_URL é injetado via envsubst no startup
    location /api/aihub/ {
        proxy_pass ${BACKEND_URL}/api/aihub/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # index.html nunca pode ser cacheado pelo browser — Vite hash-busta os assets,
    # mas o índice precisa ser refetchado a cada visita pra apontar pros assets
    # novos. Sem isso, o user fica preso na build antiga mesmo após rebuild.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # SPA fallback — qualquer rota não-arquivo cai no index.html. Headers de
    # no-cache acima reaplicam via inheritance da location = /index.html quando
    # try_files resolve pra ela.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
}
